name: Deploy SSIS Timesheet Project Via Tunneling

on:
  push:

jobs:

  deploy-local:
    runs-on: windows-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install sqlcmd
      shell: pwsh
      run: |
          choco install sqlserver-cmdlineutils -y
          # Ensure sqlcmd is on PATH for subsequent steps
          $sqlcmdDir = "C:\Program Files\Microsoft SQL Server\Client SDK\ODBC\170\Tools\Binn"
          if (-Not (Test-Path $sqlcmdDir)) {
            $sqlcmdDir = (Get-ChildItem -Path "C:\Program Files\Microsoft SQL Server" -Recurse -Filter "sqlcmd.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).DirectoryName
          }
          echo $sqlcmdDir | Out-File -FilePath $env:GITHUB_PATH -Append

    - name: Verify sqlcmd Installation
      shell: pwsh
      run: sqlcmd -?

    - name: Deploy Database
      shell: pwsh
      env:
          SQL_SERVER: ${{ secrets.SQL_SERVER }}
          SQL_DATABASE: "master"
          SQL_USER: ${{ secrets.SQL_USER }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          SQL_SCRIPT: "./Timesheet-Project/Deploy-Databases.sql"
      run: |
          sqlcmd `
            -S "$env:SQL_SERVER" `
            -d "$env:SQL_DATABASE" `
            -U "$env:SQL_USER" `
            -P "$env:SQL_PASSWORD" `
            -C `
            -i "$env:SQL_SCRIPT"

    - name: Deploy SSIS Package
      shell: pwsh
      env:
          SQL_SERVER: ${{ secrets.SQL_SERVER }}
          SQL_USER: ${{ secrets.SQL_USER }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          ISPAC_PATH: "./Timesheet-Project/Timesheet Project/bin/Development/Timesheet Project.ispac"
          SSISDB_FOLDER: "Timesheet ETL"
          SSISDB_PROJECT: "Timesheet Project"
      run: |
          $ErrorActionPreference = "Stop"

          if (-Not (Test-Path $env:ISPAC_PATH)) {
            Write-Host "ERROR: .ispac not found at: $env:ISPAC_PATH"
            Get-ChildItem -Path . -Recurse -Filter "*.ispac"
            exit 1
          }

          $bytes = [System.IO.File]::ReadAllBytes($env:ISPAC_PATH)
          $hex = -join ($bytes | ForEach-Object { $_.ToString("x2") })
          $hexStream = "0x$hex"

          sqlcmd `
            -S "$env:SQL_SERVER" `
            -U "$env:SQL_USER" `
            -P "$env:SQL_PASSWORD" `
            -C `
            -d SSISDB `
            -v FolderName="$env:SSISDB_FOLDER" `
            -v ProjectName="$env:SSISDB_PROJECT" `
            -v ProjectStream="$hexStream" `
            -i "./Timesheet-Project/deploy_ssis.sql"

    - name: Deploy SSIS Job
      shell: pwsh
      env:
          SQL_SERVER: ${{ secrets.SQL_SERVER }}
          SQL_USER: ${{ secrets.SQL_USER }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          SSIS_TARGET_SERVER: "SAMBE2025008"
          SSISDB_FOLDER: "Timesheet ETL"
          SSISDB_PROJECT: "Timesheet Project"
          SSIS_PACKAGE: "Timesheets.dtsx"
          JOB_NAME: "Timesheet ETL - Load Consultant and Client Data"
          JOB_ENABLED: "1"
          OPERATOR_NAME: "Timesheet ETL DBA"
      run: |
          sqlcmd `
            -S "$env:SQL_SERVER" `
            -U "$env:SQL_USER" `
            -P "$env:SQL_PASSWORD" `
            -C `
            -d msdb `
            -v ServerName="$env:SSIS_TARGET_SERVER" `
            -v SsisFolder="$env:SSISDB_FOLDER" `
            -v SsisProject="$env:SSISDB_PROJECT" `
            -v SsisPackage="$env:SSIS_PACKAGE" `
            -v JobName="$env:JOB_NAME" `
            -v JobOwner="NULL" `
            -v JobEnabled="$env:JOB_ENABLED" `
            -v OperatorName="$env:OPERATOR_NAME" `
            -i "./Timesheet-Project/deploy_job.sql"

  # --------------------------------------------------------------------------
  # Deploy to Partner (Rushil) Server
  #
  # Deploys the database, the .ispac, and the SQL Agent job directly to the
  # partner's SQL Server. The package reads its SQL Server connection from
  # the $Project::SQLServerName parameter, so the only thing overridden here
  # is that one parameter after deploying the .ispac.
  # --------------------------------------------------------------------------
  deploy-remote:
    needs: deploy-local
    if: false   # TEMP: disabled until EXECUTE AS LOGIN in deploy_ssis.sql/deploy_job.sql is parameterized for the partner server
    runs-on: windows-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install sqlcmd
      shell: pwsh
      run: |
          choco install sqlserver-cmdlineutils -y
          $sqlcmdDir = "C:\Program Files\Microsoft SQL Server\Client SDK\ODBC\170\Tools\Binn"
          if (-Not (Test-Path $sqlcmdDir)) {
            $sqlcmdDir = (Get-ChildItem -Path "C:\Program Files\Microsoft SQL Server" -Recurse -Filter "sqlcmd.exe" -ErrorAction SilentlyContinue | Select-Object -First 1).DirectoryName
          }
          echo $sqlcmdDir | Out-File -FilePath $env:GITHUB_PATH -Append

    - name: Deploy Database (Remote)
      shell: pwsh
      env:
          SQL_SERVER: ${{ secrets.RUSHIL_SQL_SERVER }}
          SQL_DATABASE: ${{ secrets.RUSHIL_SQL_DATABASE }}
          SQL_USER: ${{ secrets.RUSHIL_SQL_USER }}
          SQL_PASSWORD: ${{ secrets.RUSHIL_SQL_PASSWORD }}
          SQL_SCRIPT: "./Timesheet-Project/Deploy-Databases.sql"
      run: |
          sqlcmd `
            -S "$env:SQL_SERVER" `
            -d "$env:SQL_DATABASE" `
            -U "$env:SQL_USER" `
            -P "$env:SQL_PASSWORD" `
            -C `
            -i "$env:SQL_SCRIPT"

    - name: Deploy SSIS Package (Remote)
      shell: pwsh
      env:
          SQL_SERVER: ${{ secrets.RUSHIL_SQL_SERVER }}
          SQL_USER: ${{ secrets.RUSHIL_SQL_USER }}
          SQL_PASSWORD: ${{ secrets.RUSHIL_SQL_PASSWORD }}
          ISPAC_PATH: "./Timesheet-Project/Timesheet Project/bin/Development/Timesheet Project.ispac"
          SSISDB_FOLDER: "Timesheet ETL"
          SSISDB_PROJECT: "Timesheet Project"
      run: |
          $ErrorActionPreference = "Stop"

          if (-Not (Test-Path $env:ISPAC_PATH)) {
            Write-Host "ERROR: .ispac not found at: $env:ISPAC_PATH"
            Get-ChildItem -Path . -Recurse -Filter "*.ispac"
            exit 1
          }

          $bytes = [System.IO.File]::ReadAllBytes($env:ISPAC_PATH)
          $hex = -join ($bytes | ForEach-Object { $_.ToString("x2") })
          $hexStream = "0x$hex"

          sqlcmd `
            -S "$env:SQL_SERVER" `
            -U "$env:SQL_USER" `
            -P "$env:SQL_PASSWORD" `
            -C `
            -d SSISDB `
            -v FolderName="$env:SSISDB_FOLDER" `
            -v ProjectName="$env:SSISDB_PROJECT" `
            -v ProjectStream="$hexStream" `
            -i "./Timesheet-Project/deploy_ssis.sql"

    - name: Set SQLServerName Parameter (Remote)
      shell: pwsh
      env:
          SQL_SERVER: ${{ secrets.RUSHIL_SQL_SERVER }}
          SQL_USER: ${{ secrets.RUSHIL_SQL_USER }}
          SQL_PASSWORD: ${{ secrets.RUSHIL_SQL_PASSWORD }}
          SSISDB_FOLDER: "Timesheet ETL"
          SSISDB_PROJECT: "Timesheet Project"
          TARGET_SERVER_NAME: "LAPTOP-66HI94H2"           # partner's own machine name (SELECT @@SERVERNAME) — NOT the Pinggy tunnel link
      run: |
          $query = "EXEC SSISDB.catalog.set_object_parameter_value @object_type = 20, @parameter_name = N'SQLServerName', @object_name = N'`$(ProjectName)', @folder_name = N'`$(FolderName)', @project_name = N'`$(ProjectName)', @value_type = N'V', @parameter_value = N'`$(ServerNameValue)';"

          sqlcmd `
            -S "$env:SQL_SERVER" `
            -U "$env:SQL_USER" `
            -P "$env:SQL_PASSWORD" `
            -C `
            -d SSISDB `
            -v FolderName="$env:SSISDB_FOLDER" `
            -v ProjectName="$env:SSISDB_PROJECT" `
            -v ServerNameValue="$env:TARGET_SERVER_NAME" `
            -Q "$query"

    - name: Deploy SSIS Job (Remote)
      shell: pwsh
      env:
          SQL_SERVER: ${{ secrets.RUSHIL_SQL_SERVER }}     # tunnel — for sqlcmd -S only
          SQL_USER: ${{ secrets.RUSHIL_SQL_USER }}
          SQL_PASSWORD: ${{ secrets.RUSHIL_SQL_PASSWORD }}
          SSIS_TARGET_SERVER: "LAPTOP-66HI94H2"            # partner's own machine name — baked into the job step's /SERVER arg
          SSISDB_FOLDER: "Timesheet ETL"
          SSISDB_PROJECT: "Timesheet Project"
          SSIS_PACKAGE: "Timesheets.dtsx"
          JOB_NAME: "Timesheet ETL - Load Consultant and Client Data (Partner)"
          JOB_ENABLED: "1"
          OPERATOR_NAME: "Timesheet ETL DBA"
      run: |
          sqlcmd `
            -S "$env:SQL_SERVER" `
            -U "$env:SQL_USER" `
            -P "$env:SQL_PASSWORD" `
            -C `
            -d msdb `
            -v ServerName="$env:SSIS_TARGET_SERVER" `
            -v SsisFolder="$env:SSISDB_FOLDER" `
            -v SsisProject="$env:SSISDB_PROJECT" `
            -v SsisPackage="$env:SSIS_PACKAGE" `
            -v JobName="$env:JOB_NAME" `
            -v JobOwner="NULL" `
            -v JobEnabled="$env:JOB_ENABLED" `
            -v OperatorName="$env:OPERATOR_NAME" `
            -i "./Timesheet-Project/deploy_job.sql"

    - name: Remote Deployment Success
      if: success()
      shell: pwsh
      env:
        TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
        RUN_ID: ${{ github.run_id }}
      run: |
          $body = @{
            text = "🟢 PARTNER DEPLOYMENT SUCCESS 🟢`n`nDatabase, SSIS package, and job deployed to partner server.`n`nRun ID: $env:RUN_ID"
          } | ConvertTo-Json

          Invoke-RestMethod -Uri $env:TEAMS_WEBHOOK -Method Post -ContentType "application/json" -Body $body

    - name: Remote Deployment Failure
      if: failure()
      shell: pwsh
      env:
        TEAMS_WEBHOOK: ${{ secrets.TEAMS_WEBHOOK }}
        RUN_ID: ${{ github.run_id }}
      run: |
          $body = @{
            text = "🔴 PARTNER DEPLOYMENT FAILED 🔴`n`nCheck GitHub Actions logs.`n`nRun ID: $env:RUN_ID"
          } | ConvertTo-Json

          Invoke-RestMethod -Uri $env:TEAMS_WEBHOOK -Method Post -ContentType "application/json" -Body $body