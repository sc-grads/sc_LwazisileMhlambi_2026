name: Reusable SQL Deployment

on:
  workflow_call:

    inputs:

      deployment_name:
        required: true
        type: string

      sql_file:
        required: true
        type: string

      runner:
        required: true
        type: string

      server:
        required: true
        type: string

      database:
        required: false
        type: string

    secrets:

      SQL_USER:
        required: true

      SQL_PASSWORD:
        required: true

      TEAMS_WEBHOOK:
        required: true

jobs:

  deploy:

    runs-on: ${{ inputs.runner }}

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install sqlcmd (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev

      - name: Verify sqlcmd Installation (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          sqlcmd -?

      - name: Deployment Started
        if: runner.os == 'Linux'
        run: |
          curl -H "Content-Type: application/json" \
          -d "{
            \"text\":\"🟡 ${{ inputs.deployment_name }} STARTED 🟡\"
          }" \
          "${{ secrets.TEAMS_WEBHOOK }}"

      - name: Deployment Started (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $body = @{
            text = "🟡 ${{ inputs.deployment_name }} STARTED 🟡"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK }}" `
            -Method Post `
            -ContentType "application/json" `
            -Body $body

      - name: Deploy Database (Linux)
        if: runner.os == 'Linux'
        run: |
          /opt/mssql-tools18/bin/sqlcmd \
            -S "${{ inputs.server }}" \
            -U "${{ secrets.SQL_USER }}" \
            -P "${{ secrets.SQL_PASSWORD }}" \
            -C \
            -i "${{ inputs.sql_file }}"

      - name: Deploy Database (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          sqlcmd `
            -S "${{ inputs.server }}" `
            -d "${{ inputs.database }}" `
            -U "${{ secrets.SQL_USER }}" `
            -P "${{ secrets.SQL_PASSWORD }}" `
            -C `
            -i "${{ inputs.sql_file }}"

      - name: Deployment Success
        if: success() && runner.os == 'Linux'
        run: |
          curl -H "Content-Type: application/json" \
          -d "{
            \"text\":\"🟢 ${{ inputs.deployment_name }} SUCCESS 🟢\n\nRun ID: ${{ github.run_id }}\"
          }" \
          "${{ secrets.TEAMS_WEBHOOK }}"

      - name: Deployment Success (Windows)
        if: success() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $body = @{
            text = "🟢 ${{ inputs.deployment_name }} SUCCESS 🟢`n`nRun ID: ${{ github.run_id }}"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK }}" `
            -Method Post `
            -ContentType "application/json" `
            -Body $body

      - name: Deployment Failure
        if: failure() && runner.os == 'Linux'
        run: |
          curl -H "Content-Type: application/json" \
          -d "{
            \"text\":\"🔴 ${{ inputs.deployment_name }} FAILED 🔴\n\nRun ID: ${{ github.run_id }}\"
          }" \
          "${{ secrets.TEAMS_WEBHOOK }}"

      - name: Deployment Failure (Windows)
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $body = @{
            text = "🔴 ${{ inputs.deployment_name }} FAILED 🔴`n`nRun ID: ${{ github.run_id }}"
          } | ConvertTo-Json

          Invoke-RestMethod `
            -Uri "${{ secrets.TEAMS_WEBHOOK }}" `
            -Method Post `
            -ContentType "application/json" `
            -Body $body