name: Deploy SSIS Timesheet Project via Self-Hosted

on:
  workflow_dispatch:

# ----------------------------------------------------------------------------
# HOW THIS WORKS
# ----------------------------------------------------------------------------
# There are two independent job chains that BOTH run automatically on every
# push:
#   *-local  -> runs on the self-hosted runner on LAPTOP-RUSHIL (label: Laptop-rushil)
#   *-remote -> runs on the self-hosted runner on LAPTOP-LWAZI  (label: LAPTOP-Lwazi)
#
# Register the two runners (Settings -> Actions -> Runners -> New self-hosted
# runner), each with a unique label:
#   Local machine (Laptop-rushil) : ./config.cmd --labels Laptop-rushil
#   Remote machine (LAPTOP-Lwazi) : ./config.cmd --labels LAPTOP-Lwazi
#
# Note: GitHub Actions runners are automatically tagged with a label matching
# their own runner name too, so if you registered the runner without a custom
# --labels flag, its hostname is usually already usable as a label. Run
# `runs-on: [self-hosted, LAPTOP-Lwazi]` etc. only works if that label is
# actually attached to the runner - check Settings -> Actions -> Runners to
# confirm the exact label spelling/case.
# ----------------------------------------------------------------------------

jobs:

  # ---------------------------------------------------------------------
  # LOCAL CHAIN
  # ---------------------------------------------------------------------
  deploy-database-local:
    runs-on: [self-hosted, Laptop-rushil]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify sqlcmd Installation
        shell: pwsh
        run: sqlcmd -?

      - name: Deploy Database
        shell: pwsh
        env:
          SQL_SERVER: ${{ secrets.SQL_SERVER }}
          SQL_USER: ${{ secrets.SQL_USER }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          SQL_SCRIPT: "./Timesheet-Project/Deploy-Databases.sql"
        run: |
          sqlcmd -S "$env:SQL_SERVER" -U "$env:SQL_USER" -P "$env:SQL_PASSWORD" -C -i "$env:SQL_SCRIPT"

  deploy-ssis-local:
    needs: deploy-database-local
    runs-on: [self-hosted, Laptop-rushil]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify sqlcmd Installation
        shell: pwsh
        run: sqlcmd -?

      - name: Deploy SSIS Package
        shell: pwsh
        env:
          SQL_SERVER: ${{ secrets.SQL_SERVER }}
          SQL_USER: ${{ secrets.SQL_USER }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          ISPAC_PATH: "./Timesheet-Project/Timesheet Project/bin/Development/Timesheet Project.ispac"
          SSISDB_FOLDER: "Timesheet ETL"
          SSISDB_PROJECT: "Timesheet Project"
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path $env:ISPAC_PATH)) {
            Write-Host "ERROR: .ispac not found at: $env:ISPAC_PATH"
            Get-ChildItem -Recurse -Filter *.ispac
            exit 1
          }

          $bytes = [System.IO.File]::ReadAllBytes($env:ISPAC_PATH)
          $hex = "0x" + ([BitConverter]::ToString($bytes) -replace "-", "")

          $hexFile = New-TemporaryFile
          Set-Content -Path $hexFile -Value $hex -NoNewline

          sqlcmd -S "$env:SQL_SERVER" -U "$env:SQL_USER" -P "$env:SQL_PASSWORD" -C `
            -d SSISDB `
            -v FolderName="$env:SSISDB_FOLDER" `
            -v ProjectName="$env:SSISDB_PROJECT" `
            -v ProjectStreamFile="$hexFile" `
            -i "./Timesheet-Project/deploy_ssis.sql"

          Remove-Item $hexFile -Force

  deploy-job-local:
    needs: deploy-ssis-local
    runs-on: [self-hosted, Laptop-rushil]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy SSIS Job
        shell: pwsh
        env:
          SQL_SERVER: ${{ secrets.SQL_SERVER }}
          SQL_USER: ${{ secrets.SQL_USER }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          SSIS_TARGET_SERVER: "SAMBE2025008"
          SSISDB_FOLDER: "Timesheet ETL"
          SSISDB_PROJECT: "Timesheet Project"
          SSIS_PACKAGE: "Timesheets.dtsx"
          JOB_NAME: "Timesheet ETL - Load Consultant and Client Data"
          JOB_ENABLED: "1"
          OPERATOR_NAME: "Timesheet ETL DBA"
        run: |
          sqlcmd -S "$env:SQL_SERVER" -U "$env:SQL_USER" -P "$env:SQL_PASSWORD" -C `
            -d msdb `
            -v ServerName="$env:SSIS_TARGET_SERVER" `
            -v SsisFolder="$env:SSISDB_FOLDER" `
            -v SsisProject="$env:SSISDB_PROJECT" `
            -v SsisPackage="$env:SSIS_PACKAGE" `
            -v JobName="$env:JOB_NAME" `
            -v JobOwner="NULL" `
            -v JobEnabled="$env:JOB_ENABLED" `
            -v OperatorName="$env:OPERATOR_NAME" `
            -i "./Timesheet-Project/deploy_job.sql"

  # ---------------------------------------------------------------------
  # REMOTE CHAIN
  # ---------------------------------------------------------------------
  deploy-database-remote:
    runs-on: [self-hosted, LAPTOP-Lwazi]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify sqlcmd Installation
        shell: pwsh
        run: sqlcmd -?

      - name: Deploy Database
        shell: pwsh
        env:
          SQL_SERVER: ${{ secrets.RUSHIL_SQL_SERVER }}
          SQL_USER: ${{ secrets.RUSHIL_SQL_USER }}
          SQL_PASSWORD: ${{ secrets.RUSHIL_SQL_PASSWORD }}
          SQL_SCRIPT: "./Timesheet-Project/Deploy-Databases.sql"
        run: |
          sqlcmd -S "$env:SQL_SERVER" -U "$env:SQL_USER" -P "$env:SQL_PASSWORD" -C -i "$env:SQL_SCRIPT"

  deploy-ssis-remote:
    needs: deploy-database-remote
    runs-on: [self-hosted, LAPTOP-Lwazi]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify sqlcmd Installation
        shell: pwsh
        run: sqlcmd -?

      - name: Deploy SSIS Package
        shell: pwsh
        env:
          SQL_SERVER: ${{ secrets.RUSHIL_SQL_SERVER }}
          SQL_USER: ${{ secrets.RUSHIL_SQL_USER }}
          SQL_PASSWORD: ${{ secrets.RUSHIL_SQL_PASSWORD }}
          ISPAC_PATH: "./Timesheet-Project/Timesheet Project/bin/Development/Timesheet Project.ispac"
          SSISDB_FOLDER: "Timesheet ETL"
          SSISDB_PROJECT: "Timesheet Project"
        run: |
          $ErrorActionPreference = "Stop"

          if (-not (Test-Path $env:ISPAC_PATH)) {
            Write-Host "ERROR: .ispac not found at: $env:ISPAC_PATH"
            Get-ChildItem -Recurse -Filter *.ispac
            exit 1
          }

          $bytes = [System.IO.File]::ReadAllBytes($env:ISPAC_PATH)
          $hex = "0x" + ([BitConverter]::ToString($bytes) -replace "-", "")

          $hexFile = New-TemporaryFile
          Set-Content -Path $hexFile -Value $hex -NoNewline

          sqlcmd -S "$env:SQL_SERVER" -U "$env:SQL_USER" -P "$env:SQL_PASSWORD" -C `
            -d SSISDB `
            -v FolderName="$env:SSISDB_FOLDER" `
            -v ProjectName="$env:SSISDB_PROJECT" `
            -v ProjectStreamFile="$hexFile" `
            -i "./Timesheet-Project/deploy_ssis.sql"

          Remove-Item $hexFile -Force

  deploy-job-remote:
    needs: deploy-ssis-remote
    runs-on: [self-hosted, LAPTOP-Lwazi]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy SSIS Job
        shell: pwsh
        env:
          SQL_SERVER: ${{ secrets.RUSHIL_SQL_SERVER }}
          SQL_USER: ${{ secrets.RUSHIL_SQL_USER }}
          SQL_PASSWORD: ${{ secrets.RUSHIL_SQL_PASSWORD }}
          SSIS_TARGET_SERVER: "LAPTOP-Lwazi"
          SSISDB_FOLDER: "Timesheet ETL"
          SSISDB_PROJECT: "Timesheet Project"
          SSIS_PACKAGE: "Timesheets.dtsx"
          JOB_NAME: "Timesheet ETL - Load Consultant and Client Data"
          JOB_ENABLED: "1"
          OPERATOR_NAME: "Timesheet ETL DBA"
        run: |
          sqlcmd -S "$env:SQL_SERVER" -U "$env:SQL_USER" -P "$env:SQL_PASSWORD" -C `
            -d msdb `
            -v ServerName="$env:SSIS_TARGET_SERVER" `
            -v SsisFolder="$env:SSISDB_FOLDER" `
            -v SsisProject="$env:SSISDB_PROJECT" `
            -v SsisPackage="$env:SSIS_PACKAGE" `
            -v JobName="$env:JOB_NAME" `
            -v JobOwner="NULL" `
            -v JobEnabled="$env:JOB_ENABLED" `
            -v OperatorName="$env:OPERATOR_NAME" `
            -i "./Timesheet-Project/deploy_job.sql"