name: Deploy DB-Tunneling-Deploy

on:
  push:

jobs:

  notify-local-approval:
    runs-on: ubuntu-latest
    steps:
      - name: Send Local Deployment Request
        run: |
          curl -H "Content-Type: application/json" \
          -d "{
            \"text\": \"🟡 LOCAL DEPLOYMENT REQUEST 🟡\\n\\nHey RUSHIL 🫂\\n\\nA deployment has been triggered. Please review GitHub Actions before approval.\\n\\n👉 Approval link: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
          }" \
          ${{ secrets.TEAMS_WEBHOOK }}

  deploy-my-db:
    needs: notify-local-approval
    runs-on: ubuntu-latest
    environment: my-sql-server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install sqlcmd
        run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev

      - name: Deploy to Local SQL Server
        env:
          SQL_SERVER: ${{ secrets.SQL_SERVER }}
          SQL_USER: ${{ secrets.SQL_USER }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
        run: |
          /opt/mssql-tools18/bin/sqlcmd \
            -S "$SQL_SERVER" \
            -U "$SQL_USER" \
            -P "$SQL_PASSWORD" \
            -C \
            -i DB-Cloud-Tunnel-LM/Deploy.sql

      - name: Local Deployment Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -d "{
            \"text\": \"🟢 LOCAL DEPLOYMENT SUCCESS 🟢\\n\\nDatabase deployed successfully to local SQL Server via tunnel.\\n\\nRun ID: ${{ github.run_id }}\"
          }" \
          ${{ secrets.TEAMS_WEBHOOK }}

      - name: Local Deployment Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d "{
            \"text\": \"🔴 LOCAL DEPLOYMENT FAILED\\n\\nCheck GitHub Actions logs. 🔴\\n\\nRun ID: ${{ github.run_id }}\"
          }" \
          ${{ secrets.TEAMS_WEBHOOK }}


  notify-remote-approval:
    needs: deploy-my-db
    runs-on: ubuntu-latest
    steps:
      - name: Send Remote Deployment Request
        run: |
          curl -H "Content-Type: application/json" \
          -d "{
            \"text\": \"🟡 REMOTE DEPLOYMENT REQUEST\\n\\nDatabase is ready for deployment to partner SQL Server. 🟡\\n\\n👉 Review here: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
          }" \
          ${{ secrets.TEAMS_WEBHOOK }}

  deploy-partner-db:
    needs: notify-remote-approval
    runs-on: windows-latest
    environment: rushil-sql-server

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install SQLCMD
        run: choco install sqlcmd -y

      - name: Deploy to Rushil SQL Server
        shell: pwsh
        env:
          SQL_SERVER: ${{ secrets.RUSHIL_SQL_SERVER }}
          SQL_DATABASE: ${{ secrets.SQL_DATABASE }}
          SQL_USER: ${{ secrets.RUSHIL_SQL_USER }}
          SQL_PASSWORD: ${{ secrets.RUSHIL_SQL_PASSWORD }}
        run: |
          sqlcmd -S "$env:SQL_SERVER" `
                 -d "$env:SQL_DATABASE" `
                 -U "$env:SQL_USER" `
                 -P "$env:SQL_PASSWORD" `
                 -i "DB-Cloud-Tunnel-LM/Deploy.sql"

      - name: Remote Deployment Success
        if: success()
        run: |
          curl -H "Content-Type: application/json" \
          -d "{
            \"text\": \"🟢 REMOTE DEPLOYMENT SUCCESS 🟢\\n\\nDatabase deployed to partner SQL Server successfully.\\n\\nRun ID: ${{ github.run_id }}\"
          }" \
          ${{ secrets.TEAMS_WEBHOOK }}

      - name: Remote Deployment Failure
        if: failure()
        run: |
          curl -H "Content-Type: application/json" \
          -d "{
            \"text\": \"🔴 REMOTE DEPLOYMENT FAILED 🔴\\n\\nPartner deployment failed.\\n\\nRun ID: ${{ github.run_id }}\"
          }" \
          ${{ secrets.TEAMS_WEBHOOK }}