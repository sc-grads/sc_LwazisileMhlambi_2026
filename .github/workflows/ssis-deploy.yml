name: Deploy SSIS Timesheet

on:
  push:
    

jobs:

  # ============================================================================
  # JOB 1: Deploy to Production (Sambe) via Pinggy Tunnel
  #
  # Builds the .ispac, deploys the database, deploys the SSIS project, deploys
  # the SQL Agent job, and runs it -- all in one self-contained job, matching
  # the reference workflow's structure.
  # ============================================================================
  deploy-sambe:
    name: deploy-Sambe / deploy
    runs-on: windows-latest

    #environment:
      #name: production

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: false

    # NOTIFY DEPLOYMENT STARTED
    - name: Notify Deployment Started
      continue-on-error: true
      shell: powershell
      run: |
        $timestamp = Get-Date -Format "yyyy-MM-dd"
        $text = "SSIS DEPLOYMENT (SAMBE) - STARTED`n`nCreator: ${{ github.actor }}`n`nEnvironment: production (Pinggy)`n`nDate: $timestamp`n`nDeployment has started."
        $payload = @{ text = $text } | ConvertTo-Json -Depth 1
        Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK }}" -Method Post -Body $payload -ContentType "application/json"

    # CONTINUOUS INTEGRATION
    - name: Locate Visual Studio DevEnv Tool
      shell: powershell
      run: |
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property productPath
        if (-not $vsPath) {
            $vsPath = & "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property productPath
        }
        $devenvDir = Split-Path $vsPath
        $devenvCom = Join-Path $devenvDir "devenv.com"

        if (Test-Path $devenvCom) {
            Write-Host "Found Visual Studio compiler at: $devenvCom"
            echo "DEVENV_PATH=$devenvCom" | Out-File -FilePath $env:GITHUB_ENV -Append
        } else {
            Throw "CRITICAL ERROR: Visual Studio (devenv.com) was not found on this runner."
        }

    - name: Build SSIS Project to ISPAC
      shell: powershell
      run: |
        $dtprojPath = "${{ github.workspace }}\Timesheet-Project\Timesheet Project\Timesheet Project.dtproj"
        & "${{ env.DEVENV_PATH }}" "$dtprojPath" /Build "Development"

        $targetIspacPath = "${{ github.workspace }}\Timesheet-Project\Timesheet Project\bin\Development\Timesheet Project.ispac"
        if (Test-Path $targetIspacPath) {
            Write-Host "Success: .ispac deployment bundle created cleanly."
            echo "ISPAC_PATH=$targetIspacPath" | Out-File -FilePath $env:GITHUB_ENV -Append
        } else {
            Throw "Build completed, but the compiled .ispac artifact was not found inside the target bin path."
        }

    # DEPLOY DATABASE
    #
    # FIX (carried over from the ubuntu version): explicitly targets -d
    # "master" for the *connection*, then Deploy-Databases.sql itself issues
    # its own USE statements against [Timesheet-DB-LM]. Without an explicit
    # -d here, this would connect to whatever the login's default database
    # happens to be instead of a known-good starting point.
    - name: Deploy Database
      shell: powershell
      env:
          SQL_SERVER: ${{ secrets.SQL_SERVER }}
          SQL_USER: ${{ secrets.SQL_USER }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
      run: |
        sqlcmd `
          -S "$env:SQL_SERVER" `
          -d "master" `
          -U "$env:SQL_USER" `
          -P "$env:SQL_PASSWORD" `
          -C `
          -i "${{ github.workspace }}\Timesheet-Project\Deploy-Databases.sql"

    # DEPLOY SSIS PACKAGE TO SSISDB CATALOG
    - name: Deploy SSIS Package
      shell: powershell
      env:
          SQL_SERVER: ${{ secrets.SQL_SERVER }}
          SQL_USER: ${{ secrets.SQL_USER }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          SSISDB_FOLDER: "Timesheet ETL"
          SSISDB_PROJECT: "Timesheet Project"
      run: |
        $ispacPath = "${{ env.ISPAC_PATH }}"
        if (-not (Test-Path $ispacPath)) {
            Write-Host "ERROR: .ispac not found at: $ispacPath"
            Get-ChildItem -Recurse -Filter *.ispac
            exit 1
        }

        $fileBytes = [System.IO.File]::ReadAllBytes($ispacPath)
        $hexStream = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")

        sqlcmd `
          -S "$env:SQL_SERVER" `
          -d "master" `
          -U "$env:SQL_USER" `
          -P "$env:SQL_PASSWORD" `
          -C `
          -v FolderName="$env:SSISDB_FOLDER" `
          -v ProjectName="$env:SSISDB_PROJECT" `
          -v ProjectStream="$hexStream" `
          -i "${{ github.workspace }}\Timesheet-Project\deploy_ssis.sql"

    # DEPLOY SQL AGENT JOB
    #
    # NOTE: deploy_job.sql requires -v EnvironmentReferenceId=<id>, which
    # matches the reference_id of an SSISDB Environment/variable mapping
    # that overrides the SQLServer connection manager's ServerName at
    # runtime (see deploy_job.sql's own header comment). This workflow does
    # not yet create that Environment or resolve its reference_id -- that
    # step needs to be added (e.g. a deploy_environment.sql run between
    # "Deploy SSIS Package" and this step) before this will succeed against
    # any server other than the original design-time connection manager
    # value.
    - name: Deploy SSIS Job
      shell: powershell
      env:
          SQL_SERVER: ${{ secrets.SQL_SERVER }}          # tunnel — for sqlcmd -S only
          SQL_USER: ${{ secrets.SQL_USER }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          SSIS_TARGET_SERVER: "SAMBE2025008"              # local server name — baked into the job step's /SERVER arg
          SSISDB_FOLDER: "Timesheet ETL"
          SSISDB_PROJECT: "Timesheet Project"
          SSIS_PACKAGE: "Timesheets.dtsx"
          JOB_NAME: "Timesheet ETL - Load Consultant and Client Data"
          JOB_ENABLED: "1"
          OPERATOR_NAME: "Timesheet ETL DBA"
          ENVIRONMENT_REFERENCE_ID: ${{ secrets.SAMBE_ENV_REFERENCE_ID }}
      run: |
        sqlcmd `
          -S "$env:SQL_SERVER" `
          -U "$env:SQL_USER" `
          -P "$env:SQL_PASSWORD" `
          -C `
          -d msdb `
          -v ServerName="$env:SSIS_TARGET_SERVER" `
          -v SsisFolder="$env:SSISDB_FOLDER" `
          -v SsisProject="$env:SSISDB_PROJECT" `
          -v SsisPackage="$env:SSIS_PACKAGE" `
          -v JobName="$env:JOB_NAME" `
          -v JobOwner="NULL" `
          -v JobEnabled="$env:JOB_ENABLED" `
          -v OperatorName="$env:OPERATOR_NAME" `
          -v EnvironmentReferenceId="$env:ENVIRONMENT_REFERENCE_ID" `
          -i "${{ github.workspace }}\Timesheet-Project\deploy_job.sql"

    # RUN SSIS JOB
    - name: Run SSIS Job
      shell: powershell
      env:
          SQL_SERVER: ${{ secrets.SQL_SERVER }}
          SQL_USER: ${{ secrets.SQL_USER }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
      run: |
        sqlcmd `
          -S "$env:SQL_SERVER" `
          -U "$env:SQL_USER" `
          -P "$env:SQL_PASSWORD" `
          -C `
          -d msdb `
          -i "${{ github.workspace }}\Timesheet-Project\Run-SSIS-Job.sql"

    # NOTIFY SUCCESS
    - name: Notify Success
      if: success()
      continue-on-error: true
      shell: powershell
      run: |
        $timestamp = Get-Date -Format "yyyy-MM-dd"
        $text = "SSIS DEPLOYMENT (SAMBE) - SUCCESS`n`nCreator: ${{ github.actor }}`n`nEnvironment: production`n`nDate: $timestamp`n`nDeployment completed successfully."
        $payload = @{ text = $text } | ConvertTo-Json -Depth 1
        Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK }}" -Method Post -Body $payload -ContentType "application/json"

    # NOTIFY FAILURE
    - name: Notify Failure
      if: failure()
      continue-on-error: true
      shell: powershell
      run: |
        $timestamp = Get-Date -Format "yyyy-MM-dd"
        $text = "SSIS DEPLOYMENT (SAMBE) - FAILED`n`nCreator: ${{ github.actor }}`n`nEnvironment: production`n`nDate: $timestamp`n`nDeployment failed. Please review logs."
        $payload = @{ text = $text } | ConvertTo-Json -Depth 1
        Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK }}" -Method Post -Body $payload -ContentType "application/json"


  # ============================================================================
  # JOB 2: Deploy to Partner (Rushil) Server
  #
  # Deploys the database, the .ispac, and the SQL Agent job directly to the
  # partner's SQL Server. Since the package reads its SQL Server connection
  # from the $Project::SQLServerName parameter instead of a hardcoded value,
  # this job additionally overrides that parameter after deploying the
  # .ispac. No SSISDB Environments needed for this leg.
  # ============================================================================
  deploy-remote-partner:
    name: deploy-Rushil / deploy
    runs-on: windows-latest
    needs: deploy-sambe

    environment:
      name: partner

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        submodules: false

    # NOTIFY PARTNER DEPLOYMENT STARTED
    - name: Notify Partner Deployment Started
      continue-on-error: true
      shell: powershell
      run: |
        $timestamp = Get-Date -Format "yyyy-MM-dd"
        $text = "SSIS DEPLOYMENT (PARTNER) - STARTED`n`nApproved By: ${{ github.actor }}`n`nEnvironment: Partner`n`nDate: $timestamp`n`nDeployment to partner's instance has started."
        $payload = @{ text = $text } | ConvertTo-Json -Depth 1
        Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK }}" -Method Post -Body $payload -ContentType "application/json"

    # CONTINUOUS INTEGRATION
    - name: Locate Visual Studio DevEnv Tool
      shell: powershell
      run: |
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property productPath
        if (-not $vsPath) { $vsPath = & "${env:ProgramFiles}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property productPath }
        $devenvDir = Split-Path $vsPath
        $devenvCom = Join-Path $devenvDir "devenv.com"
        if (Test-Path $devenvCom) {
            Write-Host "Found Visual Studio compiler at: $devenvCom"
            echo "DEVENV_PATH=$devenvCom" | Out-File -FilePath $env:GITHUB_ENV -Append
        } else {
            Throw "CRITICAL ERROR: Visual Studio (devenv.com) was not found."
        }

    - name: Build SSIS Project to ISPAC
      shell: powershell
      run: |
        $dtprojPath = "${{ github.workspace }}\Timesheet-Project\Timesheet Project\Timesheet Project.dtproj"
        & "${{ env.DEVENV_PATH }}" "$dtprojPath" /Build "Development"
        $targetIspacPath = "${{ github.workspace }}\Timesheet-Project\Timesheet Project\bin\Development\Timesheet Project.ispac"
        if (Test-Path $targetIspacPath) {
            Write-Host "Success: .ispac deployment bundle created cleanly."
            echo "ISPAC_PATH=$targetIspacPath" | Out-File -FilePath $env:GITHUB_ENV -Append
        } else {
            Throw "Build completed, but the compiled .ispac artifact was not found."
        }

    # DEPLOY DATABASE (REMOTE)
    - name: Deploy Database (Remote)
      shell: powershell
      env:
          SQL_SERVER: ${{ secrets.RUSHIL_SQL_SERVER }}
          SQL_DATABASE: ${{ secrets.RUSHIL_SQL_DATABASE }}
          SQL_USER: ${{ secrets.RUSHIL_SQL_USER }}
          SQL_PASSWORD: ${{ secrets.RUSHIL_SQL_PASSWORD }}
      run: |
        sqlcmd `
          -S "$env:SQL_SERVER" `
          -d "$env:SQL_DATABASE" `
          -U "$env:SQL_USER" `
          -P "$env:SQL_PASSWORD" `
          -C `
          -i "${{ github.workspace }}\Timesheet-Project\Deploy-Databases.sql"

    # DEPLOY SSIS PACKAGE (REMOTE)
    - name: Deploy SSIS Package (Remote)
      shell: powershell
      env:
          SQL_SERVER: ${{ secrets.RUSHIL_SQL_SERVER }}
          SQL_USER: ${{ secrets.RUSHIL_SQL_USER }}
          SQL_PASSWORD: ${{ secrets.RUSHIL_SQL_PASSWORD }}
          SSISDB_FOLDER: "Timesheet ETL"
          SSISDB_PROJECT: "Timesheet Project"
      run: |
        $ispacPath = "${{ env.ISPAC_PATH }}"
        if (-not (Test-Path $ispacPath)) {
            Write-Host "ERROR: .ispac not found at: $ispacPath"
            Get-ChildItem -Recurse -Filter *.ispac
            exit 1
        }

        $fileBytes = [System.IO.File]::ReadAllBytes($ispacPath)
        $hexStream = "0x" + [System.BitConverter]::ToString($fileBytes).Replace("-", "")

        sqlcmd `
          -S "$env:SQL_SERVER" `
          -U "$env:SQL_USER" `
          -P "$env:SQL_PASSWORD" `
          -C `
          -v FolderName="$env:SSISDB_FOLDER" `
          -v ProjectName="$env:SSISDB_PROJECT" `
          -v ProjectStream="$hexStream" `
          -i "${{ github.workspace }}\Timesheet-Project\deploy_ssis.sql"

    # SET SQLServerName PROJECT PARAMETER (REMOTE)
    - name: Set SQLServerName Parameter (Remote)
      shell: powershell
      env:
          SQL_SERVER: ${{ secrets.RUSHIL_SQL_SERVER }}
          SQL_USER: ${{ secrets.RUSHIL_SQL_USER }}
          SQL_PASSWORD: ${{ secrets.RUSHIL_SQL_PASSWORD }}
          SSISDB_FOLDER: "Timesheet ETL"
          SSISDB_PROJECT: "Timesheet Project"
          TARGET_SERVER_NAME: "LAPTOP-66HI94H2"           # partner's own machine name (SELECT @@SERVERNAME) — NOT the Pinggy tunnel link
      run: |
        $query = "EXEC SSISDB.catalog.set_object_parameter_value @object_type = 20, @parameter_name = N'SQLServerName', @object_name = N'`$(ProjectName)', @folder_name = N'`$(FolderName)', @project_name = N'`$(ProjectName)', @value_type = N'V', @parameter_value = N'`$(ServerNameValue)';"

        sqlcmd `
          -S "$env:SQL_SERVER" `
          -U "$env:SQL_USER" `
          -P "$env:SQL_PASSWORD" `
          -C `
          -d SSISDB `
          -v FolderName="$env:SSISDB_FOLDER" `
          -v ProjectName="$env:SSISDB_PROJECT" `
          -v ServerNameValue="$env:TARGET_SERVER_NAME" `
          -Q "$query"

    # DEPLOY SSIS JOB (REMOTE)
    - name: Deploy SSIS Job (Remote)
      shell: powershell
      env:
          SQL_SERVER: ${{ secrets.RUSHIL_SQL_SERVER }}     # tunnel — for sqlcmd -S only
          SQL_USER: ${{ secrets.RUSHIL_SQL_USER }}
          SQL_PASSWORD: ${{ secrets.RUSHIL_SQL_PASSWORD }}
          SSIS_TARGET_SERVER: "LAPTOP-66HI94H2"            # partner's own machine name — baked into the job step's /SERVER arg
          SSISDB_FOLDER: "Timesheet ETL"
          SSISDB_PROJECT: "Timesheet Project"
          SSIS_PACKAGE: "Timesheets.dtsx"
          JOB_NAME: "Timesheet ETL - Load Consultant and Client Data (Partner)"
          JOB_ENABLED: "1"
          OPERATOR_NAME: "Timesheet ETL DBA"
          ENVIRONMENT_REFERENCE_ID: ${{ secrets.RUSHIL_ENV_REFERENCE_ID }}
      run: |
        sqlcmd `
          -S "$env:SQL_SERVER" `
          -U "$env:SQL_USER" `
          -P "$env:SQL_PASSWORD" `
          -C `
          -d msdb `
          -v ServerName="$env:SSIS_TARGET_SERVER" `
          -v SsisFolder="$env:SSISDB_FOLDER" `
          -v SsisProject="$env:SSISDB_PROJECT" `
          -v SsisPackage="$env:SSIS_PACKAGE" `
          -v JobName="$env:JOB_NAME" `
          -v JobOwner="NULL" `
          -v JobEnabled="$env:JOB_ENABLED" `
          -v OperatorName="$env:OPERATOR_NAME" `
          -v EnvironmentReferenceId="$env:ENVIRONMENT_REFERENCE_ID" `
          -i "${{ github.workspace }}\Timesheet-Project\deploy_job.sql"

    # NOTIFY PARTNER SUCCESS
    - name: Remote Deployment Success
      if: success()
      continue-on-error: true
      shell: powershell
      run: |
        $text = "🟢 PARTNER DEPLOYMENT SUCCESS 🟢`n`nDatabase, SSIS package, and job deployed to partner server.`n`nRun ID: ${{ github.run_id }}"
        $payload = @{ text = $text } | ConvertTo-Json -Depth 1
        Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK }}" -Method Post -Body $payload -ContentType "application/json"

    # NOTIFY PARTNER FAILURE
    - name: Remote Deployment Failure
      if: failure()
      continue-on-error: true
      shell: powershell
      run: |
        $text = "🔴 PARTNER DEPLOYMENT FAILED 🔴`n`nCheck GitHub Actions logs.`n`nRun ID: ${{ github.run_id }}"
        $payload = @{ text = $text } | ConvertTo-Json -Depth 1
        Invoke-RestMethod -Uri "${{ secrets.TEAMS_WEBHOOK }}" -Method Post -Body $payload -ContentType "application/json"