name: Deploy SSIS Timesheet Project

on:
  push:
    

jobs:

  deploy-database:

    runs-on: ubuntu-latest
    

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install sqlcmd
      run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev

    - name: Verify sqlcmd Installation
      run: /opt/mssql-tools18/bin/sqlcmd -?

    - name: Deploy Database
      env:
          SQL_SERVER: ${{ secrets.SQL_SERVER }}
          SQL_USER: ${{ secrets.SQL_USER }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          SQL_SCRIPT: "./Timesheet-Project/Deploy-Databases.sql"
      run: |
          /opt/mssql-tools18/bin/sqlcmd \
            -S "$SQL_SERVER" \
            -U "$SQL_USER" \
            -P "$SQL_PASSWORD" \
            -C \
            -i "$SQL_SCRIPT"

  deploy-operator:
    needs: deploy-database
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install sqlcmd
      run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev

    - name: Deploy SQL Agent Operator
      env:
          SQL_SERVER: ${{ secrets.SQL_SERVER }}
          SQL_USER: ${{ secrets.SQL_USER }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          OPERATOR_NAME: "Timesheet ETL DBA"
          EMAIL_ADDRESS: ${{ secrets.ALERT_EMAIL }}
          OPERATOR_ENABLED: "1"
      run: |
          /opt/mssql-tools18/bin/sqlcmd \
            -S "$SQL_SERVER" \
            -U "$SQL_USER" \
            -P "$SQL_PASSWORD" \
            -C \
            -d msdb \
            -v OperatorName="$OPERATOR_NAME" \
            -v EmailAddress="$EMAIL_ADDRESS" \
            -v OperatorEnabled="$OPERATOR_ENABLED" \
            -i "./Timesheet-Project/deploy_operator.sql"

  deploy-ssis:
    needs: deploy-database

    runs-on: ubuntu-latest

    steps: 

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install sqlcmd
      run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev

    - name: Verify sqlcmd Installation
      run: /opt/mssql-tools18/bin/sqlcmd -?
    
    - name: Deploy SSIS Package
      env:
          SQL_SERVER: ${{ secrets.SQL_SERVER }}
          SQL_USER: ${{ secrets.SQL_USER }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          ISPAC_PATH: "./Timesheet-Project/Timesheet Project/bin/Development/Timesheet Project.ispac"
          SSISDB_FOLDER: "Timesheet ETL"
          SSISDB_PROJECT: "Timesheet Project"
      run: |
          set -e

          if [ ! -f "$ISPAC_PATH" ]; then
            echo "ERROR: .ispac not found at: $ISPAC_PATH"
            find . -iname "*.ispac"
            exit 1
          fi

          HEX_STREAM="0x$(xxd -p "$ISPAC_PATH" | tr -d '\n')"

          /opt/mssql-tools18/bin/sqlcmd \
            -S "$SQL_SERVER" \
            -U "$SQL_USER" \
            -P "$SQL_PASSWORD" \
            -C \
            -d SSISDB \
            -v FolderName="$SSISDB_FOLDER" \
            -v ProjectName="$SSISDB_PROJECT" \
            -v ProjectStream="$HEX_STREAM" \
            -i "./Timesheet-Project/deploy_ssis.sql"
  
  

  deploy-job:
    needs: deploy-ssis
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install sqlcmd
      run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev

    - name: Deploy SSIS Job
      env:
          SQL_SERVER: ${{ secrets.SQL_SERVER }}          # tunnel — for sqlcmd -S only
          SQL_USER: ${{ secrets.SQL_USER }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          SSIS_TARGET_SERVER: "SAMBE2025008"              # local server name — baked into the job step's /SERVER arg
          SSISDB_FOLDER: "Timesheet ETL"
          SSISDB_PROJECT: "Timesheet Project"
          SSIS_PACKAGE: "Timesheets.dtsx"
          JOB_NAME: "Timesheet ETL - Load Consultant and Client Data"
          JOB_ENABLED: "1"
          OPERATOR_NAME: "Timesheet ETL DBA"
      run: |
          /opt/mssql-tools18/bin/sqlcmd \
            -S "$SQL_SERVER" \
            -U "$SQL_USER" \
            -P "$SQL_PASSWORD" \
            -C \
            -d msdb \
            -v ServerName="$SSIS_TARGET_SERVER" \
            -v SsisFolder="$SSISDB_FOLDER" \
            -v SsisProject="$SSISDB_PROJECT" \
            -v SsisPackage="$SSIS_PACKAGE" \
            -v JobName="$JOB_NAME" \
            -v JobOwner="NULL" \
            -v JobEnabled="$JOB_ENABLED" \
            -v OperatorName="$OPERATOR_NAME" \
            -i "./Timesheet-Project/deploy_job.sql"

  deploy-alert:
    needs: deploy-job
    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install sqlcmd
      run: |
          curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
          curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list
          sudo apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev

    - name: Deploy SSIS Alert
      env:
          SQL_SERVER: ${{ secrets.SQL_SERVER }}
          SQL_USER: ${{ secrets.SQL_USER }}
          SQL_PASSWORD: ${{ secrets.SQL_PASSWORD }}
          ALERT_NAME: "Timesheet ETL Job Failed"
          JOB_NAME: "Timesheet ETL - Load Consultant and Client Data"
          OPERATOR_NAME: "Timesheet ETL DBA"
          NOTIFICATION_MESSAGE: "The Timesheet ETL SSIS job has failed. Please check tblAuditLog in Timesheet-DB for details."
          DELAY_BETWEEN_RESPONSES: "60"
      run: |
          /opt/mssql-tools18/bin/sqlcmd \
            -S "$SQL_SERVER" \
            -U "$SQL_USER" \
            -P "$SQL_PASSWORD" \
            -C \
            -d msdb \
            -v AlertName="$ALERT_NAME" \
            -v JobName="$JOB_NAME" \
            -v OperatorName="$OPERATOR_NAME" \
            -v NotificationMessage="$NOTIFICATION_MESSAGE" \
            -v DelayBetweenResponses="$DELAY_BETWEEN_RESPONSES" \
            -i "./Timesheet-Project/deploy_alert.sql"