name: Build and Deploy SSIS Timesheet Project

on:
  push:
    #branches:
    #  - main

  #workflow_dispatch:

env:
  PROJECT_NAME: "Timesheet Project"
  SQL_SCRIPT: "./Timesheet-Project/Deploy-Databases.sql"
  SSIS_JOB_SCRIPT: "./Timesheet-Project/Run-SSIS-Job.sql"

jobs:

  build:

    runs-on: windows-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install SSIS Build Tools
      shell: powershell
      run: |
        $vsInstaller = "C:\Program Files (x86)\Microsoft Visual Studio\Installer\vs_installer.exe"
        & $vsInstaller modify `
          --installPath "C:\Program Files\Microsoft Visual Studio\2022\Enterprise" `
          --add Microsoft.VisualStudio.Component.SQL.SSDT `
          --quiet --norestart --force

    - name: Build SSIS Project
      shell: powershell
      run: |
        # Find devenv.com dynamically
        $devenv = Get-ChildItem "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter "devenv.com" | 
              Select-Object -First 1 -ExpandProperty FullName

        Write-Host "Found devenv at: $devenv"

        $solution = "${{ github.workspace }}\Timesheet-Project\Timesheet Project\Timesheet Project.slnx"
    
        & $devenv $solution /Build Release

    - name: Upload ISPAC
      uses: actions/upload-artifact@v4
      with:
        name: SSISPackage
        path: "./Timesheet-Project/Timesheet Project/bin/Release/*.ispac"

  deploy:

    needs: build

    runs-on: windows-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download ISPAC
      uses: actions/download-artifact@v4
      with:
        name: SSISPackage
        path: ./deploy

    - name: Deploy Database
      shell: powershell
      run: |
        sqlcmd `
          -S "${{ secrets.SQL_SERVER }}" `
          -U "${{ secrets.SQL_USER }}" `
          -P "${{ secrets.SQL_PASSWORD }}" `
          -i "${{ env.SQL_SCRIPT }}" `
          -C

    - name: Run SSIS Job
      shell: powershell
      run: |
        sqlcmd `
          -S "${{ secrets.SQL_SERVER }}" `
          -U "${{ secrets.SQL_USER }}" `
          -P "${{ secrets.SQL_PASSWORD }}" `
          -i "${{ env.SSIS_JOB_SCRIPT }}" `
          -C

    - name: Verify Deployment
      shell: powershell
      run: |
        echo "Deployment Complete"