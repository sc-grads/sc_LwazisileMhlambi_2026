name: Deploy SSIS Timesheet Project

on:
  push:
    #branches:
    #  - main

  #workflow_dispatch:

env:
  SQL_SCRIPT: "./Timesheet-Project/Deploy-Databases.sql"
  SSIS_JOB_SCRIPT: "./Timesheet-Project/Run-SSIS-Job.sql"

jobs:

  deploy:

    runs-on: ubuntu-latest

    steps:

    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Install sqlcmd
      run: |
        curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
        curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/mssql-release.list
        sudo apt-get update
        sudo ACCEPT_EULA=Y apt-get install -y mssql-tools18 unixodbc-dev
        echo 'export PATH="$PATH:/opt/mssql-tools18/bin"' >> ~/.bashrc
        source ~/.bashrc

    - name: Verify sqlcmd Installation
      run: /opt/mssql-tools18/bin/sqlcmd -?

    - name: Deploy Database
      run: |
        /opt/mssql-tools18/bin/sqlcmd \
          -S "${{ secrets.SQL_SERVER }}" \
          -U "${{ secrets.SQL_USER }}" \
          -P "${{ secrets.SQL_PASSWORD }}" \
          -i "${{ env.SQL_SCRIPT }}" \
          -C

    - name: Run SSIS Job
      run: |
        /opt/mssql-tools18/bin/sqlcmd \
          -S "${{ secrets.SQL_SERVER }}" \
          -U "${{ secrets.SQL_USER }}" \
          -P "${{ secrets.SQL_PASSWORD }}" \
          -i "${{ env.SSIS_JOB_SCRIPT }}" \
          -C

    - name: Verify Deployment
      run: echo "Deployment Complete"